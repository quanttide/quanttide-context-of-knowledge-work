name: compare-course-profile
description: 对比个人档案里的课程草稿与课程研发档案（正式）。产物是本任务的报告：data/report/default/compare-course-profile.md（判据写死了这条路径，任务名也照这个起）；跑法：kg --root <领域仓> --data <领域仓>/data/context/qtcloud-work task compare-course-profile --next
steps:
- name: locate
  description: 把两边的档案找齐——个人课程草稿（iGuo/materials/course）与课程研发档案（quanttide-course），指出各自在哪、里面有什么
  executor: agent
  criteria:
  - executor: rule
    description: 个人课程草稿在
    path: data/profile/iGuo/materials/course/index.md
  - executor: rule
    description: 课程研发档案在
    path: ../quanttide-course/data/profile/README.md
- name: compare
  description: 逐项对照两边——口径、重叠、各自的缺口、格式差；把对照写进报告 data/report/default/compare-course-profile.md 的「比对」一节，别动程序的「执行记录」「闸门项」两节
  executor: agent
  criteria:
  - executor: rule
    description: 报告里点到两边的课
    file: data/report/default/compare-course-profile.md
    contains: production-internship
  - executor: rule
    description: 报告里给了两侧缺口
    file: data/report/default/compare-course-profile.md
    contains: 缺口
- name: conclude
  description: 写下差异怎么处置的结论（谁回流给谁、哪些并、哪些不动），写进同一份报告 data/report/default/compare-course-profile.md 的「结论」一节，并请创始人拍板
  executor: agent
  criteria:
  - executor: rule
    description: 结论写进报告
    file: data/report/default/compare-course-profile.md
    contains: '## 结论'
  - executor: human
    description: 创始人点头（回流与并法怎么定）
