name: context-to-profile
description: 把新到的语境条目粗加工成个人档案的材料——拉语境、逐条认归属、写进 materials/<分类>/index.md、把已迁出的从语境删掉、分层提交。产物是本任务的报告：{{report}}（「条目清单」一节记每条的去向）；跑法：kg --root <领域仓> --data <领域仓>/data/context/qtcloud-work task context-to-profile --next
steps:
- name: pull
  description: 把语境拉到最新（git -C data/context pull --ff-only），把新到的日期文件逐条读一遍，清单写进报告的「条目清单」一节
  executor: agent
  criteria:
  - executor: rule
    description: 语境能拉到最新
    run: git -C data/context pull --ff-only
  - executor: rule
    description: 条目清单写进报告
    file: '{{report}}'
    contains: '## 条目清单'
- name: classify
  description: 逐条认归属：每条归到材料库的哪个分类（agent 智能体、connect 沟通、infra 基础设施、work 知识工作、org 组织管理、write 写作、meta 元工程、course 课程），把「条目 → 分类」写进报告的同一节；拿不准的单列出来
  executor: agent
  criteria:
  - executor: agent
    description: 每条都有着落——进了某个分类，或列在「拿不准」里
  - executor: human
    description: 拿不准的分类由创始人裁决
- name: coarsen
  description: 粗加工进材料——每条口语流水收成「**标签**：内容」的一节，写进 data/profile/iGuo/materials/<分类>/index.md；分类目录不在就新建，里面放 index.md。一条一意、平实陈述
  executor: agent
  criteria:
  - executor: rule
    description: 材料库有改动
    run: git status --porcelain -- data/profile/iGuo/materials | grep -q .
  - executor: agent
    description: 每条都进了对应分类，写法平实，没有「不是…而是…」式表达
- name: move-out
  description: 迁出语境——已进材料的条目从语境日期文件里删掉，日期文件留空、目录保留；没处理的条目留着
  executor: agent
  criteria:
  - executor: rule
    description: 语境仓有改动（迁出落到文件上）
    run: git -C data/context status --porcelain | grep -q .
- name: commit
  description: 分层提交推送——材料在档案仓提交推送，迁出在语境仓提交推送，再回工作区更新 data/profile 与 data/context 两个指针
  executor: agent
  criteria:
  - executor: rule
    description: 两个指针都已记录（子模块内容脏不算，看指针）
    run: 'test -z "$(git status --porcelain --ignore-submodules=dirty -- data/profile data/context)"'
  - executor: human
    description: 创始人点头（分类与迁出都对）
